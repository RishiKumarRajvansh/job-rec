{% extends "base.html" %}
{% block title %}Debug Resume Parser{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Debug Resume Parser</h4>
                </div>
                <div class="card-body">
                    <form id="debugForm" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="resume" class="form-label">Upload Resume</label>
                            <input type="file" class="form-control" id="resume" name="resume" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Test Parser</button>
                    </form>
                    
                    <div id="results" class="mt-4" style="display: none;">
                        <h5>Debug Results:</h5>
                        <pre id="debugOutput" class="bg-light p-3" style="max-height: 500px; overflow-y: auto;"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('debugForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    var formData = new FormData(this);
    var resultsDiv = document.getElementById('results');
    var outputDiv = document.getElementById('debugOutput');
    
    resultsDiv.style.display = 'none';
    outputDiv.innerHTML = 'Processing...';
    
    fetch('/debug_resume_parser', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        resultsDiv.style.display = 'block';
        outputDiv.innerHTML = JSON.stringify(data, null, 2);
    })
    .catch(error => {
        resultsDiv.style.display = 'block';
        outputDiv.innerHTML = 'Error: ' + error;
    });
});
</script>
{% endblock %}
