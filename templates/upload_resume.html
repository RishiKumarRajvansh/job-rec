{% extends "base.html" %}
{% block title %}Upload Resume - Job Recommender{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Upload Your Resume</h4>
                </div>
                <div class="card-body">
                    <p class="card-text">
                        Upload your resume to help us find jobs that match your skills and experience.
                    </p>
                    <form method="POST" action="{{ url_for('upload_resume') }}" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="resume" class="form-label">Resume File</label>
                            <input type="file" class="form-control" id="resume" name="resume" required>
                            <div class="form-text">Supported formats: PDF, DOCX, TXT</div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Upload and Analyze</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
